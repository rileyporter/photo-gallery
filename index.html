<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DAISY</title>
    <meta
      name="description"
      content="A virtual library of photo books — browse curated shelves and open a book to page through its photos."
    />

    <!-- Tints the browser's own UI chrome (e.g. Android Chrome's address
         bar, iOS Safari's toolbar) to match the site's background color
         instead of leaving it white/default -->
    <meta name="theme-color" content="#14130F" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Baseline best practice Content Security Policy. Unnecessary for the
         current status of the project as there is no backend or place to 
         inject a script. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; object-src 'none'; base-uri 'self';"
    />

    <!-- preconnect hints let the browser start the connection to Google's
         font servers before it even parses the stylesheet link below —
         shaves a little latency off the font request. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
